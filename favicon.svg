<svg width="100" height="100" viewBox="18 18 24 " xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Default colors for Light Mode */
    .letter-r { fill: #1e40af; } /* Cobalt Blue */
    .letter-s { fill: #0d9488; } /* Teal */
    .graph-lines { stroke: #1e293b; opacity: 0.1; }

    /* Colors for Dark Mode */
    @media (prefers-color-scheme: dark) {
      .letter-r { fill: #60a5fa; } /* Lighter Blue for visibility */
      .letter-s { fill: #2dd4bf; } /* Lighter Teal */
      .graph-lines { stroke: #f8fafc; opacity: 0.2; }
    }
  </style>

    <g opacity="0.5" stroke="#1e293b" stroke-width="0.5">
      <circle cx="20" cy="24" r="4" fill="#1e293b"/>
      <circle cx="50" cy="24" r="4" fill="#1e293b"/>
      <circle cx="80" cy="24" r="4" fill="#1e293b"/>
      <circle cx="50" cy="83" r="4" fill="#1e293b"/>
      <circle cx="20" cy="83" r="4" fill="#1e293b"/>
      <circle cx="80" cy="83" r="4" fill="#1e293b"/>
      <line x1="50" y1="24" x2="50" y2="50" />
      <line x1="50" y1="84" x2="50" y2="50" />
      <line x1="20" y1="24" x2="50" y2="50" />
      <line x1="80" y1="24" x2="50" y2="50" />
      <line x1="20" y1="83" x2="50" y2="50" />
      <line x1="80" y1="83" x2="50" y2="50" />
  </g>

  <text x="50" y="60" dominant-baseline="middle" text-anchor="middle"
        style="font-family: 'Inter', Arial, sans-serif; font-weight: 900; font-size: 65px; letter-spacing: -3px;">
    <tspan class="letter-r">R</tspan><tspan class="letter-s">S</tspan>
  </text>
</svg>